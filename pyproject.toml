[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"
[project]
name="h4-redlab"
version="0.1.0"
description="Offline defensive analysis of synthetic logs"
requires-python=">=3.11"
authors=[{name="Chris Cruz (@h4ckd4d)"}]
dependencies=[]
[project.optional-dependencies]
ai=["google-genai>=1.0,<3"]
[project.scripts]
redlab="redlab.cli:main"
[tool.setuptools.packages.find]
where=["src"]
